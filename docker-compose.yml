services:
  backend:
    container_name: suscord-backend
    build:
      context: ./suscord-backend
    depends_on:
      - livekit
    environment:
      API_HOST: 0.0.0.0
      DB_URL: /app/database/suscord.db
      MIGRATE: "true"
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports:
      - "8000:8000"
    volumes:
      - ./suscord-backend/database:/app/database
      - ./suscord-backend/src/assets/media:/app/assets/media
      - ./suscord-backend/src/assets/static:/app/assets/static
      - ./suscord-backend/logs:/app/logs
    restart: unless-stopped

  frontend:
    container_name: suscord-frontend
    build:
      context: ./suscord-frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      VITE_BACKEND_ORIGIN: http://localhost:8000
      VITE_FETCH_TIMEOUT_MS: 5000
      VITE_LIVEKIT_URL: ws://localhost:7880
    ports:
      - "5173:5173"
    volumes:
      - ./suscord-frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  livekit:
    container_name: suscord-livekit
    image: livekit/livekit-server:latest
    command:
      - "--config"
      - "/etc/livekit.yaml"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

volumes:
  frontend_node_modules:
